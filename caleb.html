<style>/* Sistema Grupo IP v4 · estilos comunes. Las reglas viven en DESIGN.md: cada
   valor sale de un token; la marca de cada empresa solo cambia los tokens. */
:root{
  --lienzo:#F2F4F8;--papel:#FFFFFF;--tinta:#1A1F36;--tinta-2:#4A5270;--tinta-3:#6B7390;
  --linea:#DCE1EA;--linea-2:#EDF0F5;--sel:#E4E9F2;
  --marca:#24205b;--marca-tinta:#24205b;--marca-suave:#EEF0F7;--serie:#24205b;--serie-2:#8E97B8;
  --pos:#15803D;--neg:#B42318;--aviso:#A15C07;--pos-suave:#E7F5EC;--neg-suave:#FCEBE8;--aviso-suave:#FDF2E2;
  --fuente:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --fuente-titular:'IBM Plex Serif',Georgia,'Times New Roman',serif;
  --r-panel:10px;--r-control:8px;
  --flota:0 12px 32px rgba(0,0,0,.14),0 2px 6px rgba(0,0,0,.06);
  --ease:cubic-bezier(.23,1,.32,1);--t-press:120ms;--t-entra:160ms;
  --nav-w:236px;--barra-h:60px;
}
body[data-empresa="ip"]{--tinta:#24205b;--marca:#ff4f20;--marca-tinta:#c93608;--marca-suave:#FFF1EC;--serie:#24205b;--serie-2:#9AA0C4}
body[data-empresa="caleb"]{--tinta:#0F1B33;--marca:#0F4F9C;--marca-tinta:#0F4F9C;--marca-suave:#E8EFF8;--serie:#0F4F9C;--serie-2:#A9C0E3}

*{box-sizing:border-box;margin:0;padding:0}
html{font-size:16px;-webkit-text-size-adjust:100%}
body{font-family:var(--fuente);background:var(--lienzo);color:var(--tinta);font-size:.875rem;line-height:1.45;
  -webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
body.bloqueado{overflow:hidden}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
a{color:var(--marca-tinta)}
:focus-visible{outline:2px solid var(--marca);outline-offset:2px}
::selection{background:var(--marca-suave);color:var(--tinta)}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
svg.ico{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* ---- Cabecera ------------------------------------------------------------- */
.cab{display:flex;align-items:center;gap:16px;padding:12px 24px;background:var(--papel);border-bottom:1px solid var(--linea)}
.cab-marca{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--tinta);min-width:0}
.cab-marca img{height:44px;width:auto;flex:none}
.cab-nombre{font-weight:600;font-size:1rem;line-height:1.2}
.cab-corte{color:var(--tinta-2);font-size:.8125rem}
.cab-acc{margin-left:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.hola{color:var(--tinta-2);font-size:.8125rem;margin-right:4px}

/* ---- Botones -------------------------------------------------------------- */
.btn{display:inline-flex;align-items:center;gap:8px;min-height:36px;padding:7px 14px;border-radius:var(--r-control);
  font-weight:600;font-size:.8125rem;white-space:nowrap;
  transition:transform var(--t-press) var(--ease),background-color .15s,border-color .15s,color .15s}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.45;cursor:default;transform:none}
.btn-pri{background:var(--marca-tinta);color:#fff}
.btn-sec{background:var(--papel);border:1px solid var(--linea);color:var(--tinta)}
.btn-txt{color:var(--marca-tinta);padding-inline:8px}
@media(hover:hover){.btn-pri:hover{filter:brightness(1.08)}.btn-sec:hover{border-color:var(--tinta-3)}.btn-txt:hover{text-decoration:underline}}
.btn[aria-pressed="true"]{background:var(--marca-suave);border-color:var(--marca-tinta);color:var(--marca-tinta)}

/* ---- Barra de filtros ------------------------------------------------------- */
.barra{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 24px;
  background:rgba(255,255,255,.96);border-bottom:1px solid var(--linea)}
@supports(backdrop-filter:blur(8px)){.barra{background:rgba(255,255,255,.88);backdrop-filter:blur(8px)}}
.segs{display:contents}
.seg{position:relative}
.seg>.btn{gap:6px}
.seg .n{background:var(--marca-tinta);color:#fff;border-radius:999px;font-size:.6875rem;padding:1px 7px;font-weight:700}
.pop{position:absolute;top:calc(100% + 6px);left:0;z-index:60;width:300px;max-width:calc(100vw - 24px);background:var(--papel);
  border-radius:12px;box-shadow:var(--flota);padding:12px;display:flex;flex-direction:column;gap:8px}
.pop-cab{display:none}
.pop input[type=search]{width:100%;padding:8px 10px;border:1px solid var(--linea);border-radius:var(--r-control);background:var(--papel)}
.pop-acc{display:flex;justify-content:space-between;font-size:.8125rem}
.pop-lista{max-height:280px;overflow:auto;overscroll-behavior:contain}
.pop-lista label{display:flex;align-items:center;gap:10px;padding:6px 6px;border-radius:6px;cursor:pointer;font-size:.8125rem}
.pop-lista label:hover{background:var(--lienzo)}
.pop-lista input{accent-color:var(--marca-tinta);width:16px;height:16px;flex:none}
.pop-mas{font-size:.75rem;color:var(--tinta-3);padding:6px}
.fechas{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.fechas label{display:inline-flex;align-items:center;gap:6px;font-size:.8125rem;color:var(--tinta-2)}
.fechas input[type=date],.fechas select{padding:6px 8px;border:1px solid var(--linea);border-radius:var(--r-control);background:var(--papel);font-size:.8125rem;min-height:36px}
.atajos{display:flex;gap:4px;flex-wrap:wrap}
.atajos button{padding:5px 10px;border-radius:999px;font-size:.75rem;font-weight:600;color:var(--tinta-2);border:1px solid var(--linea);background:var(--papel);min-height:30px}
.atajos button[aria-pressed="true"]{background:var(--tinta);border-color:var(--tinta);color:#fff}
.barra-fin{margin-left:auto;display:flex;gap:4px;align-items:center}
.activos{display:flex;gap:6px;flex-wrap:wrap;padding:8px 24px 0}
.activos:empty{display:none}
.ficha{display:inline-flex;align-items:center;gap:6px;background:var(--marca-suave);color:var(--tinta);border-radius:999px;
  padding:3px 4px 3px 10px;font-size:.75rem}
.ficha b{font-weight:600}
.ficha button{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;color:var(--tinta-2)}
.ficha button:hover{background:rgba(0,0,0,.06)}

/* ---- Cuerpo: menu de ruta + contenido ----------------------------------------- */
.cuerpo{display:flex;align-items:flex-start;gap:24px;max-width:1560px;margin:0 auto;padding:20px 24px 40px}
.nav{flex:0 0 var(--nav-w);position:sticky;top:calc(var(--barra-h) + 16px);max-height:calc(100vh - var(--barra-h) - 32px);overflow:auto;
  padding:4px 0}
.nav-paso{margin-bottom:14px}
.nav-paso>p{display:flex;align-items:baseline;gap:8px;font-size:.75rem;color:var(--tinta-3);padding:0 10px 6px}
.nav-paso>p b{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;border:1px solid var(--linea);
  font-size:.6875rem;font-weight:600;color:var(--tinta-2);flex:none}
.nav a{display:block;padding:8px 10px 8px 38px;border-radius:var(--r-control);text-decoration:none;color:var(--tinta-2);font-weight:500;
  font-size:.875rem;line-height:1.3;transition:background-color .15s,color .15s}
.nav a:hover{background:var(--papel);color:var(--tinta)}
.nav a[aria-current="page"]{background:var(--papel);color:var(--marca-tinta);font-weight:600;box-shadow:inset 3px 0 0 var(--marca)}
.main{flex:1 1 auto;min-width:0;outline:none}
body.sin-nav .nav{display:none}

/* ---- Seccion -------------------------------------------------------------- */
.sec-cab{margin:4px 0 18px;max-width:72ch}
.sec-cab h2{font-family:var(--fuente-titular);font-weight:600;font-size:1.625rem;line-height:1.2;letter-spacing:-.01em;color:var(--tinta)}
.lectura{margin-top:6px;font-size:.9375rem;color:var(--tinta-2);line-height:1.5}
.lectura b{color:var(--tinta);font-weight:600}
.banda{display:grid;gap:16px;margin-bottom:16px}
.banda.b2{grid-template-columns:repeat(2,minmax(0,1fr))}
.banda.b21{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}
.panel{background:var(--papel);border:1px solid var(--linea);border-radius:var(--r-panel);padding:16px 18px;min-width:0}
.panel-cab{display:flex;align-items:flex-start;gap:8px}
.panel-cab h3{font-size:.9375rem;font-weight:600;line-height:1.3;color:var(--tinta)}
.panel-cab .acc{margin-left:auto;display:flex;gap:2px;flex:none}
.pista{font-size:.8125rem;color:var(--tinta-2);margin:2px 0 10px;max-width:80ch}
.icono-btn{width:30px;height:30px;border-radius:6px;display:grid;place-items:center;color:var(--tinta-3)}
.icono-btn:hover{background:var(--lienzo);color:var(--tinta)}
.grafico{width:100%;height:320px}
.grafico.g-sm{height:250px}.grafico.g-lg{height:420px}.grafico.g-xl{height:520px}.grafico.g-xs{height:200px}
.vacio{color:var(--tinta-2);font-size:.875rem;padding:24px 4px;text-align:center}
.error{color:var(--neg);font-size:.8125rem;padding:16px 4px}
.siguiente{display:flex;justify-content:flex-end;margin:8px 0 0}
.siguiente a{display:inline-flex;flex-direction:column;align-items:flex-end;gap:2px;text-decoration:none;padding:12px 16px;
  border:1px solid var(--linea);border-radius:var(--r-panel);background:var(--papel);color:var(--tinta)}
.siguiente a small{color:var(--tinta-3);font-size:.75rem}
.siguiente a span{font-weight:600;color:var(--marca-tinta)}
@media(hover:hover){.siguiente a:hover{border-color:var(--marca-tinta)}}

/* ---- Titular del corte (lo unico audaz de la pagina) --------------------------- */
.titular{margin:4px 0 20px;max-width:820px}
.titular .lede{font-family:var(--fuente-titular);font-weight:500;font-size:clamp(1.375rem,1rem + 1.1vw,1.875rem);line-height:1.28;
  letter-spacing:-.015em;color:var(--tinta);text-wrap:pretty}
.titular .lede strong{font-weight:700}
.titular .lede-sub{margin-top:10px;font-size:.9375rem;color:var(--tinta-2);max-width:68ch}
.sube{color:var(--pos);font-weight:600;white-space:nowrap}.baja{color:var(--neg);font-weight:600;white-space:nowrap}

/* ---- Banda de indicadores: una sola pieza con divisores, no ocho tarjetas -------- */
.kpis{display:grid;grid-template-columns:repeat(var(--kpi-cols,4),minmax(0,1fr));gap:1px;background:var(--linea-2);border:1px solid var(--linea);
  border-radius:var(--r-panel);margin-bottom:16px;overflow:hidden}
.kpi{position:relative;padding:14px 16px 12px;background:var(--papel);min-width:0}
.kpi-lab{display:flex;align-items:center;gap:4px;font-size:.8125rem;color:var(--tinta-2)}
.kpi-val{font-size:1.5rem;font-weight:600;letter-spacing:-.01em;margin-top:4px;line-height:1.15;color:var(--tinta)}
.kpi-sub{font-size:.75rem;color:var(--tinta-2);margin-top:3px;min-height:1em}
.kpi-delta{font-size:.75rem;margin-top:4px;display:flex;gap:6px;flex-wrap:wrap;align-items:baseline}
.kpi-delta span:last-child{color:var(--tinta-3)}
.kpi-delta{padding-right:72px}
.kpi svg.spark{position:absolute;right:14px;bottom:14px;width:64px;height:24px;overflow:visible}
.kpi.primero .kpi-val{color:var(--marca-tinta)}
.info{width:20px;height:20px;border-radius:50%;display:inline-grid;place-items:center;color:var(--tinta-3);flex:none}
.info svg{width:15px;height:15px}
.info:hover,.info:focus-visible{color:var(--tinta)}

/* ---- Listas de lectura: que lo explica / que atender ---------------------------- */
.lista{display:flex;flex-direction:column}
.fila{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--linea-2)}
.fila:first-child{border-top:0;padding-top:4px}
.fila p{font-size:.875rem;line-height:1.4}
.fila p small{display:block;color:var(--tinta-2);font-size:.8125rem;margin-top:2px}
.marca-sev{width:10px;height:10px;border-radius:2px;margin-top:2px}
.sev-r{background:var(--neg)}.sev-a{background:var(--aviso)}.sev-b{background:var(--serie-2)}.sev-p{background:var(--pos)}
.etq{display:inline-block;font-size:.6875rem;font-weight:600;padding:2px 8px;border-radius:999px;white-space:nowrap}
.etq-r{background:var(--neg-suave);color:var(--neg)}.etq-a{background:var(--aviso-suave);color:var(--aviso)}
.etq-p{background:var(--pos-suave);color:var(--pos)}.etq-n{background:var(--lienzo);color:var(--tinta-2)}
.motores{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px 28px}
.motor h4{font-size:.8125rem;font-weight:600;color:var(--tinta-2);margin-bottom:6px}
.motor li{list-style:none;display:flex;justify-content:space-between;gap:10px;padding:5px 0;font-size:.8125rem;border-top:1px solid var(--linea-2)}
.motor li:first-child{border-top:0}
.motor li span:first-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ---- Tablas --------------------------------------------------------------- */
.tabla-acc{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.tabla-acc input[type=search]{flex:0 1 320px;min-width:0;padding:8px 10px;border:1px solid var(--linea);border-radius:var(--r-control);background:var(--papel)}
.tabla-acc .cuenta{font-size:.75rem;color:var(--tinta-3)}
.envoltura{overflow:auto;max-height:520px;border-top:1px solid var(--linea-2)}
table{width:100%;border-collapse:collapse;font-size:.8125rem}
thead th{position:sticky;top:0;background:var(--papel);text-align:left;padding:9px 10px;border-bottom:1px solid var(--linea);
  color:var(--tinta-2);font-weight:600;white-space:nowrap;z-index:1}
th[data-k]{cursor:pointer}
th.num,td.num{text-align:right}
tbody td{padding:8px 10px;border-bottom:1px solid var(--linea-2);vertical-align:top}
tbody tr:hover{background:#F8F9FB}
td.nm{max-width:340px}
tr.clic{cursor:pointer}
tfoot td{padding:9px 10px;font-weight:600;border-top:1px solid var(--tinta-3)}
.mas{margin-top:10px}
.selector{display:inline-flex;border:1px solid var(--linea);border-radius:var(--r-control);overflow:hidden;background:var(--papel)}
.selector button{padding:6px 12px;font-size:.8125rem;font-weight:600;color:var(--tinta-2);min-height:34px}
.selector button+button{border-left:1px solid var(--linea)}
.selector button[aria-pressed="true"]{background:var(--tinta);color:#fff}
.notas{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:10px;font-size:.8125rem;color:var(--tinta-2)}
.notas b{color:var(--tinta);font-weight:600}

/* ---- Informe y listas de Drive ----------------------------------------------- */
.doc{max-width:860px}
.doc p,.doc li{font-size:.9375rem;line-height:1.6;color:var(--tinta);margin-bottom:10px;max-width:75ch}
.doc ul{margin:6px 0 12px 20px}
.doc h4,.doc .rlh{font-size:.9375rem;font-weight:600;margin:20px 0 8px}
.doc{overflow-wrap:anywhere}
.doc table{margin:8px 0 16px;display:block;max-width:100%;overflow-x:auto}   /* tablas del Word: se desplazan dentro, la pagina no */
.doc table th{background:var(--lienzo);position:static}
.doc .rbox{background:var(--lienzo);border-radius:8px;padding:10px 14px;margin:10px 0;font-size:.875rem;line-height:1.5}
.kpis-doc{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin:8px 0 16px}
.kpis-doc div{background:var(--lienzo);border-radius:8px;padding:10px 12px}
.kpis-doc span{display:block;font-size:.75rem;color:var(--tinta-2)}
.kpis-doc b{font-size:1.125rem}

/* ---- Novedades ----------------------------------------------------------- */
.linea-tiempo{list-style:none;max-width:860px}
.lt-mes{font-size:.8125rem;font-weight:600;color:var(--tinta-2);margin:20px 0 6px}
.lt{display:grid;grid-template-columns:92px 1fr;gap:14px;padding:12px 0;border-top:1px solid var(--linea-2)}
.lt-v{font-size:.8125rem;color:var(--tinta-2)}
.lt-v b{display:block;color:var(--tinta);font-size:.875rem}
.lt h4{font-size:.9375rem;font-weight:600;line-height:1.35}
.lt ul{margin:6px 0 0 18px;color:var(--tinta-2);font-size:.8125rem}
.lt .etq{margin-right:6px}

/* ---- Modo reunion: proyector ------------------------------------------------ */
.franja-reunion{display:none}
html.reunion{font-size:18px}
body.reunion{font-size:1rem}
body.reunion .franja-reunion{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 24px;background:var(--tinta);color:#fff}
.franja-reunion p{font-weight:600;margin-right:auto}
.franja-reunion .btn-sec{background:transparent;color:#fff;border-color:rgba(255,255,255,.4)}
.franja-reunion select{padding:6px 10px;border-radius:var(--r-control);border:1px solid rgba(255,255,255,.4);background:transparent;color:#fff;min-height:36px}
.franja-reunion select option{color:var(--tinta)}
body.reunion .sec-cab h2{font-size:2.125rem}
body.reunion .lectura{font-size:1.125rem}
body.reunion .panel-cab h3{font-size:1.125rem}
body.reunion .pista{font-size:.9375rem}
body.reunion .kpi-val{font-size:2rem}
body.reunion .kpi-lab{font-size:.9375rem}
body.reunion .grafico{height:400px}
body.reunion .grafico.g-lg,body.reunion .grafico.g-xl{height:500px}
body.reunion table{font-size:.9375rem}

/* ---- Flotantes: globo de ayuda, velo, bienvenida ------------------------------ */
.tip{position:fixed;z-index:300;max-width:280px;background:var(--tinta);color:#fff;font-size:.8125rem;line-height:1.45;padding:9px 12px;
  border-radius:8px;box-shadow:var(--flota);pointer-events:none;opacity:0;transform:translateY(-2px);
  transition:opacity .14s var(--ease),transform .14s var(--ease)}
.tip.on{opacity:1;transform:none}
.velo{position:fixed;inset:0;z-index:100;background:rgba(15,20,40,.4)}
.saludo{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:250;background:var(--tinta);color:#fff;padding:12px 18px;
  border-radius:12px;box-shadow:var(--flota);font-weight:600;animation:saludo 3s var(--ease) forwards}
@keyframes saludo{0%{opacity:0;transform:translate(-50%,8px)}8%,80%{opacity:1;transform:translate(-50%,0)}100%{opacity:0;transform:translate(-50%,0)}}
.cargando{display:grid;place-items:center;min-height:60vh;color:var(--tinta-2)}
.pie{text-align:center;color:var(--tinta-2);font-size:.75rem;padding:16px 24px 28px}

/* ---- Movimiento: entrada de seccion, nada mas --------------------------------- */
.main>section{animation:entra var(--t-entra) var(--ease)}
@keyframes entra{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){
  .main>section{animation:none}.btn:active{transform:none}.tip{transition:none}
  .saludo{animation:none;display:none}
}

/* ---- Tamanos de ventana: amplio > 1100 · medio · compacto <= 680 ---------------- */

<!-- Puerta del Grupo IP: la comparten todas las empresas. build_dashboard.py (IP) y
     build_caleb.py la insertan en el marcador PUERTA de su plantilla y rellenan cuatro
     marcadores: la clave de la empresa de esta pagina (ip | caleb), el color del boton
     Entrar, el logo del paso 2 y el nombre del paso 2. Ver los .replace de cada build.
     Paso 1 elige la empresa; si es otra, se navega a su pagina con #entrar, que salta
     directo al paso 2. Los ids pin / enter / gerr los usa boot() de cada plantilla:
     no renombrarlos.                                                                  -->
<style>
#gate{--door-accent:#0F4F9C;position:fixed;inset:0;z-index:200;background:#EEF0F4;display:flex;align-items:center;
  justify-content:center;padding:20px 16px;overflow-y:auto;font-family:'IBM Plex Sans',system-ui,sans-serif;color:#15181E}
.dcard{background:#fff;border-radius:20px;box-shadow:0 18px 48px rgba(0,0,0,.12),0 2px 6px rgba(0,0,0,.05);padding:26px 28px 24px;
  width:100%;max-width:600px;margin:auto}
.dstep{font-size:13px;color:#5E6573;margin-bottom:6px;font-variant-numeric:tabular-nums}
.dcard h2{font-size:21px;font-weight:700;letter-spacing:-.01em;line-height:1.25;text-wrap:balance}
.cos{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:18px}
.co{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:space-between;gap:10px;min-height:160px;
  padding:16px 12px 14px;background:#fff;border:1px solid #D9DCE2;border-radius:14px;font:inherit;color:#15181E;text-align:center;
  cursor:pointer;transition:transform 120ms cubic-bezier(.23,1,.32,1),border-color .15s ease,box-shadow .15s ease}
.co img{width:100%;height:74px;object-fit:contain}
.co b{font-size:13.5px;font-weight:600;line-height:1.3}
.co .last{position:absolute;top:8px;right:8px;font-size:11px;font-weight:600;color:#3F4552;background:#EEF0F4;border-radius:20px;padding:1px 8px}
@media(hover:hover){.co:not([disabled]):hover{border-color:#5E6573}}
.co:not([disabled]):active{transform:scale(.97)}
.co:focus-visible,.dback:focus-visible,#enter:focus-visible{outline:2px solid var(--door-accent);outline-offset:2px}
.co[disabled]{background:#F5F6F8;cursor:not-allowed}
.co[disabled] b{color:#5E6573}
.co .rv{height:74px;display:grid;place-items:center;font-size:19px;font-weight:700;letter-spacing:.08em;color:#5E6573}
.co .soon{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:#5E6573}
.gatecard{max-width:400px;text-align:center}
.gatelogo{width:112px;height:112px;margin:4px auto 10px;display:grid;place-items:center}
.gatelogo svg{width:112px;height:112px}

#pin{width:100%;text-align:center;letter-spacing:8px;font:inherit;font-size:21px;font-weight:700;padding:12px;border:2px solid #D9DCE2;
  border-radius:12px;color:#15181E;background:#fff}
#pin:focus{outline:none;border-color:var(--door-accent)}
#enter{width:100%;margin-top:12px;background:var(--door-accent);color:#fff;border:none;border-radius:12px;padding:13px;font:inherit;
  font-size:15px;font-weight:700;cursor:pointer;transition:transform 120ms cubic-bezier(.23,1,.32,1),opacity .15s ease}
#enter:active{transform:scale(.97)}
@media(hover:hover){#enter:hover{opacity:.92}}
.gerr{color:#B3141C;font-size:13px;font-weight:600;margin-top:10px;min-height:18px}

  .dcard{padding:22px 18px 20px}
  .cos{grid-template-columns:minmax(0,1fr)}
  .co{flex-direction:row;justify-content:flex-start;min-height:0;text-align:left;padding:12px 14px}
  .co img,.co .rv{width:104px;height:48px;flex:none}

}

<div id="gate" data-here="caleb">
  <section class="dcard" id="paso-empresa" aria-labelledby="pe-h">
    <p class="dstep">Grupo IP · Paso 1 de 2</p>
    <h2 id="pe-h">¿A qué empresa vas a entrar?</h2>
    <div class="cos">
      <button class="co" type="button" data-co="ip" data-href="index.html"><img src="assets/logo-ip.png" alt=""><b>Distribuidora y Suministros IP</b></button>
      <button class="co" type="button" data-co="caleb" data-href="caleb.html"><img src="assets/logo-caleb.png" alt=""><b>Tiendas Caleb</b></button>
      <button class="co" type="button" disabled><span class="rv" aria-hidden="true">REVIPLAS</span><span><b>Reviplas</b><br><span class="soon">Próximamente</span></span></button>
    </div>
  </section>
  <section class="dcard gatecard" id="paso-pin" aria-labelledby="pp-h" hidden>
    <p class="dstep">Grupo IP · Paso 2 de 2</p>
    <div class="gatelogo"><img src="assets/logo-caleb.png" alt="Tiendas Caleb"></div>
    <h2 id="pp-h">Tiendas Caleb</h2>
    <p>Escribe tu PIN de 6 dígitos</p>
    <input id="pin" type="password" inputmode="numeric" maxlength="6" placeholder="••••••" autocomplete="off" aria-label="PIN de 6 dígitos">
    <button id="enter" type="button">Entrar</button>
    <div class="gerr" id="gerr" role="alert"></div>
    <button class="dback" id="dback" type="button">Cambiar de empresa</button>
  </section>
</div>
<script>
(function(){
  var gate=document.getElementById('gate'),here=gate.getAttribute('data-here');
  var s1=document.getElementById('paso-empresa'),s2=document.getElementById('paso-pin');
  var KEY='grupoipEmpresa';
  function paso(n){s1.hidden=n!==1;s2.hidden=n!==2;
    if(n===2){try{document.getElementById('pin').focus();}catch(e){}}
    else{var b=s1.querySelector('.co[data-co="'+here+'"]');try{b&&b.focus({preventScroll:true});}catch(e){}}}
  var ultima=null;try{ultima=localStorage.getItem(KEY);}catch(e){}
  s1.querySelectorAll('.co[data-co]').forEach(function(b){
    var co=b.getAttribute('data-co');
    if(co===ultima){var t=document.createElement('span');t.className='last';t.textContent='Último acceso';b.appendChild(t);}
    b.onclick=function(){
      try{localStorage.setItem(KEY,co);}catch(e){}
      if(co===here){paso(2);history.replaceState(null,'','#entrar');}
      else{location.href=b.getAttribute('data-href')+'#entrar';}};
  });
  document.getElementById('dback').onclick=function(){
    document.getElementById('gerr').textContent='';history.replaceState(null,'',location.pathname);paso(1);};
  paso(location.hash==='#entrar'?2:1);
})();
</script>

<script>/* Motor de datos del Sistema Grupo IP (sin DOM).

  /* Orden de tabla: numeros como numeros aunque vengan como texto del Excel

  const valorOrden = v => { if (typeof v === 'number') return v; if (v == null || v === '' || v === '—') return null;
    const t = String(v).replace(/[$,\s%]/g, ''); return /^-?\d+(\.\d+)?$/.test(t) ? parseFloat(t) : String(v); };

    if (x === null || y === null) return x === y ? 0 : x === null ? -1 : 1;
    if (typeof x === 'number' && typeof y === 'number') return x - y;
    if (typeof x === 'number') return -1; if (typeof y === 'number') return 1;

  /* ---- Indicadores: una banda; en reunion se ocultan los sensibles ---------- */

      + '<div class="kpi-val">' + esc(k.val) + '</div><div class="kpi-sub">' + (k.sub || '') + '</div>'
      + (k.delta ? '<div class="kpi-delta">' + delta(k.delta) + '</div>' : '') + (k.serie && k.serie.length > 1 ? chispa(k.serie) : '') + '</div>').join('');

<script>/* Tiendas Caleb: secciones del dashboard sobre el nucleo. Reglas de calculo en

(function (G) {

  const GCOL = ['#0F4F9C', '#B7800F', '#0891B2', '#7C3AED'];            // Construccion, Acero, Jardin, Pinturas
  const TCOL = ['#0F4F9C', '#B7800F', '#7C3AED', '#0891B2', '#5B6B7F'];  // Persona, Empresa, Gobierno, Consumidor, Otro
  const PAL = ['#0F4F9C', '#B7800F', '#0891B2', '#7C3AED', '#C2417A', '#5B6B7F'];
  const DOW = ['Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb', 'Dom'];
  const HATCH = { symbol: 'rect', symbolSize: 1, rotation: Math.PI / 4, dashArrayX: [1, 0], dashArrayY: [2, 5], color: 'rgba(15,79,156,.45)' };
  const UNID = { PZA: 'piezas', UND: 'unidades', UNID: 'unidades', KG: 'kg', KL: 'kg', GL: 'galones', GAL: 'galones', M2: 'm²', MT2: 'm²', MTS: 'metros', MT: 'metros',
    ML: 'metros', CAJA: 'cajas', ROLLO: 'rollos', SACO: 'sacos', PAR: 'pares', '1/4': 'cuartos de galón' };
  const DIN = ['neto', 'bruto', 'devm', 'vm', 'cst', 'p0', 'sc'];
  let D = null;   // precalculos sobre TODO el periodo (no dependen de los filtros)

  /* ---- Precalculos y agregados ----------------------------------------------- */
  function iniciar(S) {
    const c = S.M.cols, n = S.M.n, P = S.P;
    const tiendaAbre = new Uint8Array(P.dayCount), primera = new Map(), ultimaProd = new Map(), totVend = new Map();
    for (let r = 0; r < n; r++) {
      const d = c.dia[r], cl = c.cli[r];
      tiendaAbre[d] = 1;
      const f = primera.get(cl); if (f == null || d < f) primera.set(cl, d);
      if (c.q[r] > 0) { const l = ultimaProd.get(c.prod[r]); if (l == null || d > l) ultimaProd.set(c.prod[r], d); }
      totVend.set(c.vend[r], (totVend.get(c.vend[r]) || 0) + c.neto[r]);
    }
    const vcol = {};
    [...totVend.entries()].sort((a, b) => b[1] - a[1]).forEach(([v], i) => { vcol[v] = i < 5 ? PAL[i] : C.slate; });
    D = { tiendaAbre, primera, ultimaProd, vcol, wOff: (new Date(P.dayZero + 'T00:00:00').getDay() + 6) % 7, cmp: 'mes', frio: 21 };
  }
  const dow = off => (off + D.wOff) % 7;
  const semana = off => Math.floor((off + D.wOff) / 7);
  const inicioSemana = w => w * 7 - D.wOff;
  function diasVenta(a, b) { let k = 0; for (let i = Math.max(0, a); i <= Math.min(D.tiendaAbre.length - 1, b); i++) k += D.tiendaAbre[i]; return k; }
  function rangoMesIdx(c, m) { let a = -1, b = -1; c.dims.dayMes.forEach((x, i) => { if (x === m) { if (a < 0) a = i; b = i; } }); return [a, b]; }
  const mesAbierto = c => { const d = c.P.dateMax.split('-'); return +d[2] < new Date(+d[0], +d[1], 0).getDate(); };
  const unidad = (c, p) => { const u = (c.dims.prodUnidad[p] || '').toUpperCase(); return UNID[u] || (u ? u.toLowerCase() : 'unidades'); };

  /* Filas de un rango con los segmentadores actuales (la clave de cada uno es su columna) */
  function filas(c, a, b) { const f = {}; for (const k in GIP.S.f) if (GIP.S.f[k].size) f[k] = GIP.S.f[k]; return c.M.seleccion({ f, rango: [a, b] }); }
  /* Agregado de un conjunto de filas: lo mismo que agg() de la v3 */
  function agg(c, idx) {
    const col = c.M.cols, e = c.M.esc.neto, o = { neto: 0, bruto: 0, devm: 0, vm: 0, cst: 0, p0: 0, sc: 0, cant: 0, q: 0, lineas: idx.length };
    const docs = new Map(), clis = new Set(), prods = new Set(), din = DIN.filter(k => col[k]);
    for (let i = 0; i < idx.length; i++) {
      const r = idx[i];

      d.n += col.neto[r]; d.c += col.cant[r]; d.v += col.dev[r];

    o.mgPct = o.vm ? o.mg / o.vm * 100 : 0;

  function porGrupo(c, idx, col) {

  }
  function sumaPor(c, idx, col, val) {
    const g = c.M.cols[col], v = c.M.cols[val], e = c.M.esc[val], m = new Map();
    for (let i = 0; i < idx.length; i++) { const r = idx[i]; m.set(g[r], (m.get(g[r]) || 0) + v[r] / e); }
    return m;
  }
  const A = c => c._A || (c._A = valores(c, c.sel, c.rango[0], c.rango[1]));
  function valores(c, idx, a, b) {
    const o = agg(c, idx), sd = diasVenta(a, b);
    const nuevos = [...o.clis].filter(cl => { const f = D.primera.get(cl); return f >= a && f <= b; }).length;
    const pn = sumaPor(c, idx, 'prod', 'neto'), pq = sumaPor(c, idx, 'prod', 'q');
    let agot = 0, agotN = 0; pq.forEach((q, p) => { if (q > 0 && c.dims.prodEx[p] <= 0) { agot++; agotN += pn.get(p) || 0; } });
    return Object.assign(o, { sd, rate: sd ? o.neto / sd : 0, facD: sd ? o.fac / sd : 0, cliD: sd ? o.cli / sd : 0, nuevos, agot, agotN });
  }
  /* Semanas del rango, con la marca "en curso" si la ultima no cerro */
  function semanas(c, idx, val) {
    const [a, b] = c.rango, m = new Map(), col = c.M.cols, dia = col.dia;
    for (let i = 0; i < idx.length; i++) { const r = idx[i], w = semana(dia[r]); m.set(w, (m.get(w) || 0) + val(r)); }
    const ultW = semana(c.P.dayCount - 1), cierra = dow(c.P.dayCount - 1) >= 5, ws = [];
    for (let w = semana(a); w <= semana(b); w++) { const s = Math.max(a, inicioSemana(w)), e = Math.min(b, inicioSemana(w) + 6);
      ws.push({ w, v: m.get(w) || 0, lab: F.fechaCorta(c.offAFecha(inicioSemana(w))), s, e, sd: diasVenta(s, e), parcial: w === ultW && !cierra }); }
    return ws;
  }
  const netoFila = c => { const v = c.M.cols.neto, e = c.M.esc.neto; return r => v[r] / e; };
  function filasPorSemana(c) { const m = new Map(), dia = c.M.cols.dia; for (const r of c.sel) { const w = semana(dia[r]); let a = m.get(w); if (!a) { a = []; m.set(w, a); } a.push(r); } return m; }

  /* ---- Comparador de los indicadores ------------------------------------------ */
  function periodos(c) {
    const [a, b] = c.rango, m = D.cmp, MESL = i => F.mesCorto(i);

  function grafNuevos(c, ch) {
    const ws = semanas(c, c.sel, () => 0), nv = ws.map(() => new Set()), rc = ws.map(() => new Set()), w0 = ws.length ? ws[0].w : 0, col = c.M.cols;
